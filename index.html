<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaserConfig | Speed & Power Calculator</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- js-yaml for config.yml -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <!-- PapaParse for materials.csv -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="calculator-card">
    <header>
      <h1>Laser Parameter Calculator</h1>
      <p>Tampere Hacklab Calibration Tool</p>
    </header>

    <form id="laserForm">
      <!-- Machine Setup -->
      <fieldset>
        <legend>Machine Setup (from config.yml)</legend>
        
        <div class="form-group">
          <label for="ratedPower">Rated Laser Power (W):</label>
          <input type="number" id="ratedPower" min="10" max="500" step="5" required>
        </div>

        <div class="form-group">
          <label for="installDate">Tube Installation Date:</label>
          <input type="date" id="installDate" required>
        </div>

        <div class="form-group">
          <label for="usageIntensity">Weekly Usage Intensity:</label>
          <select id="usageIntensity">
            <option value="light">Light (&lt; 5 hrs/week)</option>
            <option value="medium">Medium (5–15 hrs/week)</option>
            <option value="heavy">Heavy (&gt; 15 hrs/week)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="lensType">Focal Lens:</label>
          <select id="lensType">
            <option value="1.5">1.5" (38.1 mm) - Fine Engraving</option>
            <option value="2.0">2.0" (50.8 mm) - Standard / Hybrid</option>
            <option value="4.0">4.0" (101.6 mm) - Thick Cutting</option>
          </select>
        </div>
      </fieldset>

      <!-- Material & Task Specs -->
      <fieldset>
        <legend>Job & Material Specs (from materials.csv)</legend>

        <div class="form-group">
          <label for="material">Material:</label>
          <select id="material">
            <!-- Dynamically populated via PapaParse -->
          </select>
        </div>

        <div class="form-group">
          <label for="taskMode">Task Mode:</label>
          <select id="taskMode">
            <option value="cut">Through Cut</option>
            <option value="etch">Etch / Engrave</option>
          </select>
        </div>

        <div class="form-group" id="thicknessGroup">
          <label for="thickness">Material Thickness (mm):</label>
          <input type="number" id="thickness" value="3.0" min="0.1" max="25.0" step="0.5" required>
        </div>

        <div class="form-group hidden" id="etchDepthGroup">
          <label for="etchDepth">Target Etch Depth (mm):</label>
          <input type="number" id="etchDepth" value="0.5" min="0.05" max="3.0" step="0.05" required>
        </div>

        <div class="form-group">
          <label for="airAssist">Air Assist Pressure:</label>
          <select id="airAssist">
            <option value="high">High Flow (Compressed Air)</option>
            <option value="low">Low / Gentle Flow</option>
            <option value="none">Off / None</option>
          </select>
        </div>
      </fieldset>
    </form>

    <!-- Results Panel -->
    <div class="results-panel">
      <h2>Recommended Settings</h2>

      <div class="status-badge" id="tubeHealthBadge">
        Tube Health: <span id="healthValue">100%</span>
      </div>

      <div class="grid-results">
        <div class="result-box">
          <span class="label">Speed</span>
          <span class="value" id="resSpeed">--</span>
        </div>

        <div class="result-box">
          <span class="label">Power</span>
          <span class="value" id="resPower">--</span>
        </div>

        <div class="result-box">
          <span class="label">Passes</span>
          <span class="value" id="resPasses">--</span>
        </div>

        <div class="result-box">
          <span class="label">Focus Offset</span>
          <span class="value" id="resFocus">--</span>
        </div>
      </div>

      <div id="alertBox" class="alert-box hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
